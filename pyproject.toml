[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tracewarden"
version = "0.1.0"
description = "Deterministic, fully-offline static security linter for recorded AI-agent tool-call traces (indirect prompt injection, lethal trifecta, secret exfiltration, RCE, over-broad tool use), mapped to the OWASP Agentic Top 10."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Dhanush Shankar" }]
keywords = [
    "ai-security",
    "prompt-injection",
    "agent-security",
    "owasp",
    "static-analysis",
    "llm-security",
    "sarif",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["rich>=13.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/Danush-Aries/tracewarden"
Repository = "https://github.com/Danush-Aries/tracewarden"

[project.scripts]
tracewarden = "tracewarden.cli:main"

[tool.setuptools]
packages = ["tracewarden", "tracewarden.loaders", "tracewarden.reporters"]

[tool.pytest.ini_options]
testpaths = ["tests"]
